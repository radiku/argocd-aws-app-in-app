apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:
  name: nginx-exporter
  namespace: monitoring

  labels:
    release: kube-prometheus-stack

spec:

  selector:
    matchLabels:
      app: nginx-exporter

  namespaceSelector:
    matchNames:
      - lab2

  endpoints:
    - port: metrics
      interval: 30s
