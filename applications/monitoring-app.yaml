apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-app
  namespace: argocd

  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: default

  source:
    repoURL: https://github.com/radiku/argocd-aws-app-in-app.git
    targetRevision: HEAD
    path: monitoring

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
